name: CI

# Nothing here reaches the network. The site fetches at runtime, so the tests never need
# the archive and the build never does either — which means this is green whether the CDN
# is having a good day or not.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No `version` here. The action reads `packageManager` from package.json, and v4
      # treats specifying both as an error rather than a preference.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      # The client comes from the registry, so this needs nothing from the other
      # repository. Only the npm registry is reached, and `--frozen-lockfile` pins what
      # that resolves to.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # A static export is the deployment artefact, so a build that only passes locally is
      # not a build that ships.
      - name: Build the site
        run: pnpm build
